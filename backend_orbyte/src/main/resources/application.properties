spring.application.name=backend_orbyte

# ===========================
# Server
# ===========================
server.port=8081

# ===========================
# H2 In-Memory Database (dev)
# ===========================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===========================
# PostgreSQL (production)
# Uncomment and set env vars
# ===========================
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===========================
# Swagger / OpenAPI
# ===========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===========================
# JWT
# In production, override via environment variable JWT_SECRET (>= 32 chars)
# ===========================
jwt.secret=${JWT_SECRET:OrbyteJwtSecretKeyForLocalDevSigningKeyAndTesting}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# ===========================
# AES Encryption
# In production, override via environment variable ENCRYPTION_SECRET (>= 32 chars)
# ===========================
encryption.secret=${ENCRYPTION_SECRET:OrbyteEncryptionKey32BytesPadded!}

# ===========================
# Admin User (created at startup)
# In production, override via environment variables
# ===========================
admin.email=${ADMIN_EMAIL:admin@orbyte.ai}
admin.password=${ADMIN_PASSWORD:admin123}

# ===========================
# CORS
# ===========================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===========================
# External Services
# ===========================
fastapi.url=${FASTAPI_URL:http://localhost:8000}

# ===========================
# File Upload
# ===========================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB