# Server port for testing
server.port=8081

# H2 in-memory database configuration for unit and integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT secret for testing
jwt.secret=orbyte_test_secret_key_which_is_sufficiently_long_for_hs256_testing_purposes_123456
jwt.expiration=60000
jwt.refresh-expiration=600000

# FastAPI url mock
fastapi.url=http://localhost:8000
